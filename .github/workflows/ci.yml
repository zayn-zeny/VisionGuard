name: CI — VisionGuard 23L-0578_A2_Ops

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Python setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Lint with flake8 (configuration lives in .flake8)
      - name: Lint (flake8)
        run: flake8 app/ scripts/ tests/ --count --statistics

      # 5. Run tests
      - name: Run pytest
        env:
          INFERENCE_MODE: local
          MODEL_PATH:     models/champion.keras
          THRESHOLD:      "0.5"
          FLASK_SECRET_KEY: ci-test-secret
          DATABASE_URL:   sqlite:///test_visionguard.db
          MODEL_NAME:     MobileNetV2_VisionGuard
          MODEL_VERSION:  champion
          MAX_CONTENT_LENGTH_MB: "10"
        run: |
          pytest tests/ -v --tb=short

      # 6. Build Docker image
      #    models/champion.keras is git-ignored (19 MB binary, versioned in the
      #    MLflow registry), so CI bakes a tiny stand-in model with the same
      #    input/output shape. This checks that the Dockerfile builds; the real
      #    champion is pulled by scripts/register_champion.py for releases.
      - name: Create stand-in model for the image build
        run: |
          python - <<'PY'
          import os, keras
          os.makedirs("models", exist_ok=True)
          if not os.path.exists("models/champion.keras"):
              m = keras.Sequential([keras.Input((224, 224, 3)),
                                    keras.layers.GlobalAveragePooling2D(),
                                    keras.layers.Dense(1, activation="sigmoid")])
              m.save("models/champion.keras")
          PY

      - name: Build Docker image
        run: |
          docker build -t visionguard-ci:${{ github.sha }} .

      # Workflow secrets note (Task 6.6):
      # Any secret used in CI (DAGSHUB_TOKEN, POSTGRES_PASSWORD, etc.) must
      # live in GitHub repo Settings → Secrets and Variables → Actions.
      # They are referenced as ${{ secrets.SECRET_NAME }} in YAML.
      # They must NEVER be literals in this file — GitHub scans for known
      # secret patterns and blocks commits that contain them, and even a
      # short-lived literal in git history is permanently exposed.

